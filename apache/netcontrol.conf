# =============================================================================
# Ham Radio Net Tracker — Apache Reverse Proxy Configuration
# =============================================================================
# Domain  : netcontrol.meskis.net
# App     : FastAPI (uvicorn) running on localhost:8000
# SSL     : Let's Encrypt via Certbot
# User    : netcontrol  (systemd service account)
#
# Installation
# ------------
# 1. Copy this file to /etc/apache2/sites-available/netcontrol.conf
# 2. Enable required modules:
#      sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
# 3. Enable the site:
#      sudo a2ensite netcontrol
# 4. Obtain/renew SSL certificate:
#      sudo certbot --apache -d netcontrol.meskis.net
# 5. Reload Apache:
#      sudo systemctl reload apache2
#
# The Certbot run in step 4 will automatically update the SSL paths below
# and add the HTTPS redirect in the HTTP block.  If you manage certificates
# manually, set the SSLCertificateFile paths yourself.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName netcontrol.meskis.net

    # Certbot will manage this block after "certbot --apache"
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS — reverse proxy to FastAPI/uvicorn
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName netcontrol.meskis.net

    # ── SSL ──────────────────────────────────────────────────────────────────
    SSLEngine on
    # Certbot populates these paths automatically; update if using manual certs
    SSLCertificateFile    /etc/letsencrypt/live/netcontrol.meskis.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/netcontrol.meskis.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ── Proxy to uvicorn ─────────────────────────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests     Off

    # Pass real client IP to the app
    RequestHeader set X-Forwarded-For  "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket support (for future use)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:8000/$1" [P,L]

    # All other requests
    ProxyPass        / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    # ── Static file caching headers ──────────────────────────────────────────
    <LocationMatch "^/static/.*\?v=">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # ── Logging ──────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/netcontrol_error.log
    CustomLog ${APACHE_LOG_DIR}/netcontrol_access.log combined

</VirtualHost>
