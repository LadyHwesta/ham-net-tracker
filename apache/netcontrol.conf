# =============================================================================
# Ham Radio Net Tracker — Apache Reverse Proxy Configuration
# =============================================================================
# Domain  : netcontrol.meskis.net
# App     : FastAPI (uvicorn) running on localhost:8000
# SSL     : Let's Encrypt via Certbot
# User    : netcontrol  (systemd service account)
#
# Installation
# ------------
# 1. Copy this file to /etc/apache2/sites-available/netcontrol.conf
# 2. Enable required modules:
#      sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl
#    (headers module is optional — only needed if you uncomment the caching block below)
# 3. Enable the site:
#      sudo a2ensite netcontrol
# 4. Run Certbot — it will obtain the certificate AND inject the SSL config:
#      sudo certbot --apache -d netcontrol.meskis.net
# 5. Reload Apache:
#      sudo systemctl reload apache2
#
# Do NOT add SSLCertificateFile or SSLCertificateKeyFile lines manually.
# Certbot manages those paths and keeps them updated on renewal.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName netcontrol.meskis.net

    # Certbot will manage this block after "certbot --apache"
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS — reverse proxy to FastAPI/uvicorn
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName netcontrol.meskis.net

    # ── SSL ──────────────────────────────────────────────────────────────────
    # SSL certificate paths and options are managed automatically by Certbot.
    # Run:  sudo certbot --apache -d netcontrol.meskis.net
    # Certbot will insert the SSLCertificateFile, SSLCertificateKeyFile, and
    # Include directives here and keep them updated on renewal.

    # ── Proxy to uvicorn ─────────────────────────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests     Off

    # Pass real client IP to the app
    RequestHeader set X-Forwarded-For  "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket support (for future use)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:8000/$1" [P,L]

    # All other requests
    ProxyPass        / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    # ── Static file caching headers (optional) ───────────────────────────────
    # Apache LocationMatch cannot match query strings, so this applies to all
    # /static/ responses regardless of ?v= parameter.  The app uses versioned
    # query strings (?v=N) for browser-level cache busting; this header tells
    # CDNs and proxies to cache static assets aggressively.
    #
    # Requires mod_headers:  sudo a2enmod headers && sudo systemctl reload apache2
    #
    # <LocationMatch "^/static/">
    #     Header set Cache-Control "public, max-age=31536000, immutable"
    # </LocationMatch>

    # ── Logging ──────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/netcontrol_error.log
    CustomLog ${APACHE_LOG_DIR}/netcontrol_access.log combined

</VirtualHost>
